name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: carpooling_symfony_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping
          --host=127.0.0.1
          --user=root
          --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: >-
        mysql://root:root@127.0.0.1:3306/carpooling_symfony?serverVersion=10.11.0-MariaDB&charset=utf8mb4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish --no-interaction

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run database migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Validate Doctrine schema
        run: php bin/console doctrine:schema:validate

      - name: Run PHPUnit
        run: php bin/phpunit
